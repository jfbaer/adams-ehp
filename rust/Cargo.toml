[package]
name = "lambda_e2"
version = "0.1.0"
edition = "2021"
description = "Lambda-algebra E2 pages for the EHP spectral sequence (Curtis algorithm) and operations on them: products, Hopf H, suspension E, Whitehead P, and Mahowald's map to Lambda(C2)"
readme = "README.md"
license = "Apache-2.0"
publish = false

[dependencies]
itertools = "0.14.0"
rayon = "1.10.0"
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.132"
bincode = "1.3"
flate2 = "1.0"
csv = "1.3"
memmap2 = "0.9"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# Release profile for long batch runs
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
