<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why-graph browser</title>
<style>
  :root {
    /* Catppuccin Latte — matches the light why-graph SVGs and the charts. */
    --base: #eff1f5; --mantle: #e6e9ef; --surface: #ccd0da;
    --text: #4c4f69; --subtext: #7c7f93; --red: #d20f39; --border: #bcc0cc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--base); color: var(--text);
               font: 14px/1.4 -apple-system, Helvetica, Arial, sans-serif;
               overflow: hidden; }
  #stage { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
  #stage.panning { cursor: grabbing; }
  #graph { position: absolute; left: 0; top: 0; transform-origin: 0 0;
           user-select: none; -webkit-user-drag: none; }
  #hud { position: absolute; top: 10px; left: 12px; pointer-events: none;
         color: var(--text); text-shadow: 0 1px 3px var(--base); }
  #hud .sub { color: var(--subtext); font-size: 12px; }
  #warnings { position: absolute; top: 10px; right: 12px; max-width: 40%;
              display: none; padding: 6px 10px; background: #f6d8dfee;
              color: var(--red); border-radius: 6px; white-space: pre-wrap;
              font-family: Menlo, monospace; font-size: 12px; }
  #empty { position: absolute; inset: 0; display: none; align-items: center;
           justify-content: center; color: var(--subtext); font-size: 18px; }
  .panel { position: absolute; left: 12px; bottom: 12px; display: none;
           background: #e6e9efee; border: 1px solid var(--border);
           border-radius: 8px; padding: 10px 12px; }
  .panel label { margin-right: 1em; white-space: nowrap; }
  .panel .row { margin-bottom: 6px; }
  select, input, button { background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font: inherit; }
  input[type=number] { width: 4.5em; }
  #help { position: absolute; right: 12px; bottom: 12px; display: none;
          background: #e6e9efee; border: 1px solid var(--border);
          border-radius: 8px; padding: 10px 12px; color: var(--subtext);
          font-size: 12px; line-height: 1.7; }
  kbd { background: var(--surface); color: var(--text); border-radius: 3px;
        padding: 0 4px; font-family: Menlo, monospace; }
</style>
</head>
<body>
<div id="stage"><img id="graph" alt=""></div>
<div id="empty">No graphs match the current filters.</div>
<div id="hud"><div id="title">–</div><div class="sub" id="meta"></div></div>
<div id="warnings"></div>
<div class="panel" id="filters">
  <div class="row">
    <label><input type="checkbox" class="pg" value="2" checked> d2</label>
    <label><input type="checkbox" class="pg" value="3" checked> d3</label>
    <label><input type="checkbox" class="pg" value="4" checked> d4</label>
    <label><input type="checkbox" class="pg" value="5" checked> d5</label>
    <label>sort <select id="sort">
      <option value="rsnf">r, s, n, f</option>
      <option value="rnsf">r, n, s, f</option>
    </select></label>
  </div>
  <div class="row">
    <label>n <input type="number" id="nMin" placeholder="min"> – <input type="number" id="nMax" placeholder="max"></label>
    <label>stem <input type="number" id="sMin" placeholder="min"> – <input type="number" id="sMax" placeholder="max"></label>
  </div>
  <div class="row">
    <label>min proof length <input type="number" id="lenMin" placeholder="0"></label>
    <label><input type="checkbox" id="warnOnly"> warnings only</label>
    <label><input type="checkbox" id="nosrcOnly"> unsourced only</label>
    <button id="resetBtn">reset</button>
  </div>
</div>
<div id="help">
  <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> <kbd>j</kbd>/<kbd>k</kbd> prev/next<br>
  <kbd>PgUp</kbd>/<kbd>PgDn</kbd> &plusmn;25 &nbsp; <kbd>Home</kbd>/<kbd>End</kbd><br>
  <kbd>g</kbd> jump to &ldquo;r n s f&rdquo; or index<br>
  <kbd>f</kbd> filters &nbsp; <kbd>?</kbd> this help<br>
  wheel zoom &middot; drag pan &middot; <kbd>0</kbd>/dbl-click fit
</div>
<script src="manifest.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);

const defaultFilters = () => ({
  pages: [2, 3, 4, 5], nMin: null, nMax: null, sMin: null, sMax: null,
  lenMin: null, warnOnly: false, nosrcOnly: false,
});
const state = { idx: 0, sort: "rsnf", filters: defaultFilters() };
try {
  const saved = JSON.parse(sessionStorage.getItem("whyviewer") || "null");
  if (saved) Object.assign(state, saved);
} catch (e) { /* ignore corrupt state */ }

let active = [];   // filtered+sorted indices into MANIFEST

function rebuild() {
  const f = state.filters;
  active = [];
  for (let i = 0; i < MANIFEST.length; i++) {
    const m = MANIFEST[i];
    if (!f.pages.includes(m.r)) continue;
    if (f.nMin !== null && m.n < f.nMin) continue;
    if (f.nMax !== null && m.n > f.nMax) continue;
    if (f.sMin !== null && m.s < f.sMin) continue;
    if (f.sMax !== null && m.s > f.sMax) continue;
    if (f.lenMin !== null && m.len < f.lenMin) continue;
    if (f.warnOnly && !m.warn.length) continue;
    if (f.nosrcOnly && !m.nosrc) continue;
    active.push(i);
  }
  const key = state.sort === "rnsf"
    ? i => { const m = MANIFEST[i]; return [m.r, m.n, m.s, m.f]; }
    : i => { const m = MANIFEST[i]; return [m.r, m.s, m.n, m.f]; };
  active.sort((a, b) => {
    const ka = key(a), kb = key(b);
    for (let j = 0; j < 4; j++) if (ka[j] !== kb[j]) return ka[j] - kb[j];
    return 0;
  });
  state.idx = Math.max(0, Math.min(state.idx, active.length - 1));
  show();
}

function persist() {
  sessionStorage.setItem("whyviewer", JSON.stringify(state));
}

// --- pan/zoom -----------------------------------------------------------
// The image starts fitted so the whole graph is visible, then wheel zooms
// (toward the cursor) and dragging pans. 0 / double-click refits.
const view = { x: 0, y: 0, scale: 1 };
const MAX_FIT = 1.5;   // don't blow tiny graphs up past 1.5x natural size

function applyView() {
  $("graph").style.transform =
    `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
}

function fitView() {
  const img = $("graph");
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !nh) return;
  const sw = $("stage").clientWidth, sh = $("stage").clientHeight;
  view.scale = Math.min(sw / nw, sh / nh, MAX_FIT);
  view.x = (sw - nw * view.scale) / 2;
  view.y = (sh - nh * view.scale) / 2;
  applyView();
}

$("graph").addEventListener("load", fitView);
window.addEventListener("resize", fitView);

$("stage").addEventListener("wheel", ev => {
  ev.preventDefault();
  const factor = ev.deltaY < 0 ? 1.15 : 1 / 1.15;
  const ns = Math.min(Math.max(view.scale * factor, 0.02), 20);
  // keep the point under the cursor fixed
  view.x = ev.clientX - (ev.clientX - view.x) * (ns / view.scale);
  view.y = ev.clientY - (ev.clientY - view.y) * (ns / view.scale);
  view.scale = ns;
  applyView();
}, { passive: false });

let drag = null;
$("stage").addEventListener("pointerdown", ev => {
  drag = { x: ev.clientX - view.x, y: ev.clientY - view.y };
  $("stage").classList.add("panning");
  $("stage").setPointerCapture(ev.pointerId);
});
$("stage").addEventListener("pointermove", ev => {
  if (!drag) return;
  view.x = ev.clientX - drag.x;
  view.y = ev.clientY - drag.y;
  applyView();
});
$("stage").addEventListener("pointerup", () => {
  drag = null;
  $("stage").classList.remove("panning");
});
$("stage").addEventListener("dblclick", fitView);

// --- display ------------------------------------------------------------
function show() {
  persist();
  if (!active.length) {
    $("graph").style.display = "none";
    $("empty").style.display = "flex";
    $("title").textContent = "–";
    $("meta").textContent = "";
    $("warnings").style.display = "none";
    return;
  }
  $("empty").style.display = "none";
  $("graph").style.display = "";
  const m = MANIFEST[active[state.idx]];
  $("graph").src = m.file;   // fitView runs on load
  $("title").textContent = `d${m.r}(${m.n}, ${m.s}, ${m.f})`;
  $("meta").textContent = `${state.idx + 1} / ${active.length}`
    + ` · proof ${m.len}, ${m.nodes} nodes`
    + (m.nosrc ? ` · ${m.nosrc} unsourced` : "");
  const w = $("warnings");
  if (m.warn.length) { w.textContent = m.warn.join("\n"); w.style.display = "block"; }
  else w.style.display = "none";
  for (const off of [1, -1, 2, -2, 3, -3]) {
    const j = state.idx + off;
    if (j >= 0 && j < active.length) new Image().src = MANIFEST[active[j]].file;
  }
}

function move(delta) {
  if (!active.length) return;
  state.idx = Math.max(0, Math.min(state.idx + delta, active.length - 1));
  show();
}

function jump() {
  const q = prompt("Jump to “r n s f” (e.g. 3 9 37 7) or an index:");
  if (!q) return;
  const parts = q.trim().split(/[\s,()]+/).filter(Boolean).map(Number);
  if (parts.some(isNaN)) return;
  if (parts.length === 1) { state.idx = parts[0] - 1; }
  else if (parts.length === 4) {
    const [r, n, s, f] = parts;
    let best = -1;
    for (let j = 0; j < active.length; j++) {
      const m = MANIFEST[active[j]];
      if (m.r === r && m.n === n && m.s === s && m.f === f) { best = j; break; }
      if (best === -1 && m.r === r && m.s >= s) best = j;  // nearest fallback
    }
    if (best === -1) { alert("not found in current filter"); return; }
    state.idx = best;
  } else { alert("expected 1 or 4 numbers"); return; }
  state.idx = Math.max(0, Math.min(state.idx, active.length - 1));
  show();
}

// --- filter panel wiring ------------------------------------------------
function readFilters() {
  const num = id => { const v = $(id).value; return v === "" ? null : Number(v); };
  state.filters = {
    pages: [...document.querySelectorAll(".pg:checked")].map(c => Number(c.value)),
    nMin: num("nMin"), nMax: num("nMax"),
    sMin: num("sMin"), sMax: num("sMax"),
    lenMin: num("lenMin"),
    warnOnly: $("warnOnly").checked,
    nosrcOnly: $("nosrcOnly").checked,
  };
  rebuild();
}
function writeFilters() {
  const f = state.filters;
  document.querySelectorAll(".pg").forEach(c => c.checked = f.pages.includes(Number(c.value)));
  $("nMin").value = f.nMin ?? ""; $("nMax").value = f.nMax ?? "";
  $("sMin").value = f.sMin ?? ""; $("sMax").value = f.sMax ?? "";
  $("lenMin").value = f.lenMin ?? "";
  $("warnOnly").checked = f.warnOnly;
  $("nosrcOnly").checked = f.nosrcOnly;
  $("sort").value = state.sort;
}
document.querySelectorAll("#filters input").forEach(el =>
  el.addEventListener("change", readFilters));
$("resetBtn").onclick = () => {
  state.filters = defaultFilters();
  writeFilters(); rebuild();
};
$("sort").onchange = () => { state.sort = $("sort").value; rebuild(); };

const togglePanel = id => {
  const p = $(id);
  p.style.display = p.style.display === "block" ? "none" : "block";
};

document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT") return;
  switch (ev.key) {
    case "ArrowRight": case "k": move(1); break;
    case "ArrowLeft":  case "j": move(-1); break;
    case "PageDown": move(25); ev.preventDefault(); break;
    case "PageUp":   move(-25); ev.preventDefault(); break;
    case "Home": state.idx = 0; show(); break;
    case "End":  state.idx = active.length - 1; show(); break;
    case "g": jump(); break;
    case "f": togglePanel("filters"); break;
    case "?": togglePanel("help"); break;
    case "0": fitView(); break;
  }
});

// Deep link from the interactive charts: index.html#d3/9/37/7 jumps straight
// to that differential, widening the filters if they'd hide it.
function applyHash() {
  const m = location.hash.match(/^#d(\d+)\/(-?\d+)\/(-?\d+)\/(-?\d+)$/);
  if (!m) return;
  const [r, n, s, f] = m.slice(1).map(Number);
  const find = () => active.findIndex(i => {
    const x = MANIFEST[i];
    return x.r === r && x.n === n && x.s === s && x.f === f;
  });
  let j = find();
  if (j === -1) {
    state.filters = defaultFilters();
    writeFilters(); rebuild();
    j = find();
  }
  if (j === -1) {
    alert(`No why graph for d${r}(${n}, ${s}, ${f}) — its differential value is zero or outside the generated set.`);
    return;
  }
  state.idx = j;
  show();
}
window.addEventListener("hashchange", applyHash);

writeFilters();
rebuild();
applyHash();
</script>
</body>
</html>
